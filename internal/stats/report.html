<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>catnip stats</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js" integrity="sha384-Emf5ZVIUiarAdhkgtqK+5/Z5qIvM6QoVrS+qAVtfyZVuD5lIHrac0me485+Antp0" crossorigin="anonymous"></script>
<style>
  body { font: 14px system-ui, sans-serif; margin: 2em auto; max-width: 1200px; padding: 0 1em; color: #222; }
  h2 { margin-top: 2em; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid #ddd; padding: .3em .8em; text-align: left; vertical-align: top; }
  th { background: #f4f4f4; white-space: nowrap; }
  td { word-break: break-all; }
  td.n { text-align: right; white-space: nowrap; word-break: normal; }
  pre { white-space: pre-wrap; word-break: break-all; margin: 0; }
  .chart { height: 260px; }
  .go { cursor: pointer; }
  tr.go:hover, td.go:hover, a.go:hover { background: #eef4ff; }
  a.go { color: #0645ad; }
  .bar { display: flex; gap: .5em; align-items: center; flex-wrap: wrap; }
  .chip { background: #eef4ff; border: 1px solid #bcd; border-radius: 1em; padding: .1em .7em; }
  .chip button { border: none; background: none; cursor: pointer; padding: 0 0 0 .3em; }
  .card td { background: #fafafa; }
  .card th { background: none; width: 8em; }
  .muted { color: #777; }
  .err { color: #b00; }
</style>
</head>
<body>
<h1>catnip stats</h1>
<div class="bar">
  <label>period <select id="days">
    <option value="1">1 day</option><option value="7">7 days</option><option value="30">30 days</option>
    <option value="90">90 days</option><option value="0">all</option>
  </select></label>
  <span id="filters" class="bar"></span>
</div>
<div id="report"></div>

<script>
const outcomes = {0: 'ok', 1: 'not applied', 2: 'bad usage', 3: 'check failed'};
const colors = {0: '#4caf50', 1: '#ff9800', 2: '#e53935', 3: '#8e24aa'};
const outcome = c => outcomes[c] ?? `exit ${c}`;
const filters = ['project', 'worktree', 'kind', 'code', 'file', 'group'];
const pageSize = 100; // stats.PageSize
const local = t => t ? new Date(t).toLocaleString() : '';
let chart;

// The page state is the hash: the period and the filters.
const state = () => {
  const s = new URLSearchParams(location.hash.slice(1));
  if (!s.has('days')) s.set('days', '30');
  return s;
};
function go(changes) {
  const s = state();
  for (const [k, v] of Object.entries(changes)) v == null ? s.delete(k) : s.set(k, v);
  location.hash = s.toString();
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) k.startsWith('on') ? e[k] = v : e.setAttribute(k, v);
  for (const c of children) e.append(c instanceof Node ? c : String(c ?? ''));
  return e;
}
// link sets filters on click.
const link = (text, changes) => el('a', {class: 'go', onclick: e => { e.stopPropagation(); go(changes); }}, text);
const num = (n, attrs) => el('td', {class: 'n', ...attrs}, n ?? 0);
const table = (head, rows) => el('table', {}, el('tr', {}, ...head.map(h => el('th', {}, h))), ...rows);

// rel is path from base when it lies below it.
function rel(path, base) {
  if (!path || !base || path === base) return path;
  for (const sep of ['/', '\\']) if (path.startsWith(base + sep)) return path.slice(base.length + 1);
  return path;
}

const shq = a => /^[\w@%+=:,./#-]+$/.test(a) ? a : "'" + a.replaceAll("'", "'\\''") + "'";

async function api(view, extra) {
  const s = state(), q = new URLSearchParams();
  for (const k of ['days', ...filters]) if (s.has(k)) q.set(k, s.get(k));
  for (const [k, v] of Object.entries(extra || {})) q.set(k, v);
  const r = await fetch(`api/${view}?${q}`);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function render() {
  const s = state();
  document.getElementById('days').value = s.get('days');
  document.getElementById('filters').replaceChildren(...filters.filter(k => s.has(k)).map(k => el('span', {class: 'chip'},
    `${k}: ${k === 'code' ? (s.get(k) === 'failed' ? 'failed' : outcome(s.get(k))) : s.get(k) || '(none)'}`,
    el('button', {title: 'remove', onclick: () => go({[k]: null})}, '×'))));
  const project = s.get('project');
  const root = document.getElementById('report');
  let days, places, usage, errors, calls;
  try {
    [days, places, usage, errors, calls] = await Promise.all([
      api('days'), api(project ? 'worktrees' : 'projects'), api('usage'), api('errors'), api('calls')]);
  } catch (e) {
    root.replaceChildren(el('p', {class: 'err'}, e.message));
    return;
  }
  const total = places.reduce((n, r) => n + r.calls, 0), failed = places.reduce((n, r) => n + r.failed, 0);
  root.replaceChildren(
    el('p', {}, `calls: ${total}, failed: ${failed}` + (total ? ` (${Math.round(100 * failed / total)}%)` : '')),
    el('h2', {}, 'Calls by day'), el('div', {class: 'chart'}, el('canvas', {id: 'days-chart'})),
    ...(project ? worktrees(places, project) : projects(places)),
    el('h2', {}, 'Usage'), usageTable(usage),
    el('h2', {}, 'Errors'), errorsTable(errors),
    el('h2', {}, 'Calls'), feed(calls));
  daysChart(days);
}

function daysChart(rows) {
  if (chart) chart.destroy();
  const canvas = document.getElementById('days-chart');
  if (!window.Chart) {
    canvas.replaceWith('Chart.js did not load from jsDelivr.');
    return;
  }
  const labels = [...new Set(rows.map(r => r.day))], codes = [...new Set(rows.map(r => r.code))].sort();
  chart = new Chart(canvas, {
    type: 'bar',
    data: {labels, datasets: codes.map(c => ({
      label: outcome(c), backgroundColor: colors[c],
      data: labels.map(d => (rows.find(r => r.day === d && r.code === c) || {calls: 0}).calls),
    }))},
    options: {animation: false, maintainAspectRatio: false, scales: {x: {stacked: true}, y: {stacked: true}}},
  });
}

function projects(rows) {
  return [el('h2', {}, 'Projects'), table(['project', 'calls', 'failed', 'show', 'edit', 'write', 'last call'], rows.map(r =>
    el('tr', {class: 'go', onclick: () => go({project: r.project})},
      el('td', {}, r.project), num(r.calls),
      num(r.failed, {class: 'n go', onclick: e => { e.stopPropagation(); go({project: r.project, code: 'failed'}); }}),
      num(r.show), num(r.edit), num(r.write), el('td', {}, local(r.last)))))];
}

function worktrees(rows, project) {
  return [el('h2', {}, project), table(['worktree', 'branch', 'config', 'calls', 'failed', 'last call'], rows.map(r =>
    el('tr', {class: 'go', onclick: () => go({worktree: r.worktree})},
      el('td', {}, r.worktree === project ? '(main)' : rel(r.worktree, project) || '(no git)'), el('td', {}, r.branch),
      el('td', {}, rel(r.config, project) || el('span', {class: 'muted'}, 'none')),
      num(r.calls), num(r.failed), el('td', {}, local(r.last)))))];
}

function usageTable(rows) {
  const kinds = [...new Set(rows.map(r => r.kind))], codes = [...new Set(rows.map(r => r.code))].sort();
  const count = (k, c) => (rows.find(r => r.kind === k && r.code === c) || {calls: 0}).calls;
  return table(['command', ...codes.map(outcome), 'total', 'failed'], kinds.map(k => {
    const all = codes.reduce((n, c) => n + count(k, c), 0), bad = all - count(k, 0);
    return el('tr', {},
      el('td', {}, k ? link(k, {kind: k}) : '(none)'),
      ...codes.map(c => count(k, c) ? num(count(k, c), {class: 'n go', onclick: () => go({kind: k, code: String(c)})}) : num('')),
      num(all), num(bad ? `${bad} (${Math.round(100 * bad / all)}%)` : ''));
  }));
}

function errorsTable(rows) {
  if (!rows.length) return el('p', {class: 'muted'}, 'none');
  return table(['error', 'outcome', 'calls', 'last'], rows.map(r =>
    el('tr', {class: 'go', onclick: () => go({group: r.group})},
      el('td', {}, el('pre', {}, r.group || '(no message)')), el('td', {}, outcome(r.code)), num(r.calls), el('td', {}, local(r.last)))));
}

function feed(rows) {
  const t = table(['time', 'command', 'outcome', 'file', 'error'], []);
  const more = el('button', {}, 'older');
  const add = rows => {
    for (const r of rows) {
      const row = el('tr', {class: 'go'},
        el('td', {}, local(r.time)), el('td', {}, r.kind), el('td', {class: r.code ? 'err' : ''}, outcome(r.code)),
        el('td', {}, rel(r.file, r.worktree || r.project)), el('td', {}, el('pre', {}, r.error.split('\n')[0])));
      let open;
      row.onclick = () => {
        if (open) {
          open.remove();
          open = null;
          return;
        }
        open = el('tr', {class: 'card'}, el('td', {colspan: 5}, card(r)));
        row.after(open);
      };
      t.append(row);
    }
    more.hidden = rows.length < pageSize;
    if (rows.length) more.onclick = () => api('calls', {before: rows[rows.length - 1].id}).then(add);
  };
  add(rows);
  return el('div', {}, rows.length ? t : el('p', {class: 'muted'}, 'none'), more);
}

function card(r) {
  const argv = r.argv ? JSON.parse(r.argv) : null;
  const cmd = argv ? `cd ${shq(r.cwd)} && catnip ${argv.map(shq).join(' ')}` : '';
  const line = (name, ...value) => el('tr', {}, el('th', {}, name), el('td', {}, ...value));
  return el('table', {},
    line('time', local(r.time)),
    line('outcome', outcome(r.code)),
    line('command', argv ? el('pre', {}, cmd) : el('span', {class: 'muted'}, 'argv dropped: the database outgrew its limit'),
      argv ? el('button', {onclick: e => { e.stopPropagation(); navigator.clipboard.writeText(cmd); }}, 'copy') : ''),
    ...(r.error ? [line('error', el('pre', {}, r.error)), line('error group', link(r.group, {group: r.group}))] : []),
    line('cwd', r.cwd),
    line('file', r.file ? link(r.file, {file: r.file}) : ''),
    line('project', link(r.project, {project: r.project})),
    line('worktree', r.worktree ? link(r.worktree, {project: r.project, worktree: r.worktree}) : ''),
    line('branch', r.branch),
    line('config', r.config || el('span', {class: 'muted'}, 'none')));
}

document.getElementById('days').onchange = e => go({days: e.target.value});
window.onhashchange = render;
render();
</script>
</body>
</html>
