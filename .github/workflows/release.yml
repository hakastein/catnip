name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make go
      - run: make dist
      # The release notes are the tag's section of CHANGELOG.md.
      - run: |
          awk -v tag="$GITHUB_REF_NAME" '/^## /{p = $2 == tag; next} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section $GITHUB_REF_NAME"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
